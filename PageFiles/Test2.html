<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bean Haunted Coffee</title>
  <link rel="stylesheet" href="Reviews.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
10002b
  <style>
    /* === Glowing Halloween Text Effect === */
    :root {
      --x: 0;
      --y: 0;
      --xp: 0;
      --yp: 0;
      --hue: calc(0 + (var(--xp) * 360));
      --bg: var(--bg);
      --glow: radial-gradient(50% 50% at center,
        hsl(var(--hue) 90% 80%),
        hsl(var(--hue) 90% 60%),
        transparent)
        calc(var(--x) * 1px) calc(var(--y) * 1px) / 200px 200px no-repeat fixed;
    }

    #Hero-Text h1 {
      font-family: 'Playfair Display', serif;
      text-transform: uppercase;
      text-align: center;
      color: transparent;
      background:
        linear-gradient(90deg, orange, purple, limegreen, brown, red, white, black, orange),
        var(--glow);
      background-size: 400%;
      background-clip: text;
      -webkit-background-clip: text;
      animation: colorShift 10s linear infinite;
      position: relative;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      line-height: 1.1;
    }

    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
  </style>
</head>

<body>

  <div id="Hero-Nav">
    <div class="nav-left">
      <img src="Images/logo.png" alt="Bean Haunted Coffee Logo" width="200" />
    </div>

    <div class="nav-right">
      <a href="tel:+16612379944">
        <img src="Images/phone.png" alt="Phone Icon" width="50" />
      </a>
      <img 
        src="Images/menus.png" 
        alt="Menu Icon" 
        width="50" 
        id="hamburgerIcon"
        onclick="toggleMenu()" 
        style="cursor: pointer;"
      />
    </div>
  </div>

  <!-- Hidden Menu -->
  <div id="mobileMenu" class="menu">
    <div class="close-btn" id="closeMenu">✕</div>
    <h2 class="menu-title">BEAN HAUNTED</h2>
    <img src="SVGS/Shopping.svg" alt="Shopping Cart" class="shopping-icon" />
    <nav class="menu-links">
      <a href="index.html">Main Page</a>
      <a href="menu.html">Menu</a>
      <a href="reviews.html">Reviews</a>
      <a href="contact.html">Contact</a>
      <a href="services.html">Services</a>
    </nav>
    <div class="social-icons">
      <img src="Images/facebook.png" alt="Facebook" />
      <img src="Images/tik-tok.png" alt="TikTok" />
      <img src="Images/instagram.png" alt="Instagram" />
    </div>
  </div>

  <div id="Hero-Text">
    <h1>BEAN HAUNTED <br> COFFEE</h1>
  </div>

  <script>
    /* === Mobile Menu Logic === */
    const menu = document.getElementById("mobileMenu");
    const hamburger = document.getElementById("hamburgerIcon");
    const closeBtn = document.getElementById("closeMenu");

    function toggleMenu() {
      menu.classList.toggle("active");
    }

    document.addEventListener("click", (event) => {
      const clickedInsideMenu = menu.contains(event.target);
      const clickedHamburger = hamburger.contains(event.target);
      if (!clickedInsideMenu && !clickedHamburger) {
        menu.classList.remove("active");
      }
    });

    closeBtn.addEventListener("click", () => menu.classList.remove("active"));
    menu.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", () => menu.classList.remove("active"));
    });

    /* === Cursor Glow Sync === */
    const syncPointer = ({ x: pointerX, y: pointerY }) => {
      const x = pointerX.toFixed(2);
      const y = pointerY.toFixed(2);
      const xp = (pointerX / window.innerWidth).toFixed(2);
      const yp = (pointerY / window.innerHeight).toFixed(2);
      document.documentElement.style.setProperty('--x', x);
      document.documentElement.style.setProperty('--y', y);
      document.documentElement.style.setProperty('--xp', xp);
      document.documentElement.style.setProperty('--yp', yp);
    };
    document.body.addEventListener('pointermove', syncPointer);
  </script>
</body>
</html>
